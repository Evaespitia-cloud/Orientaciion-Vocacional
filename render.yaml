services:
  - type: web
    name: orientacion-vocacional
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r frontend/requirements.txt gunicorn
    startCommand: bash start_render.sh
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orientacion-vocacional-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: orientacion-vocacional-db
    plan: free
    ipAllowList: []
