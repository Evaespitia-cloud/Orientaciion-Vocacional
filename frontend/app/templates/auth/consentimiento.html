{% extends "base.html" %}
{% block title %}Consentimiento — Orientación Vocacional{% endblock %}

{% block content %}
<a href="{{ url_for('main.index') }}" style="position:fixed; top:1.2rem; left:1.4rem; display:inline-flex; align-items:center; gap:0.45rem; color:var(--primary); background:rgba(79,70,229,0.08); border:1px solid rgba(79,70,229,0.25); padding:0.45rem 1rem 0.45rem 0.75rem; border-radius:999px; font-size:0.85rem; font-weight:600; text-decoration:none; z-index:100; transition:background 0.2s;" onmouseover="this.style.background='rgba(79,70,229,0.15)'" onmouseout="this.style.background='rgba(79,70,229,0.08)'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    Inicio
</a>
<div class="container" style="max-width: 700px; margin-top: 2rem;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 0.5rem;" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <h1 style="font-size: 1.5rem; color: var(--primary); margin-top: 0.5rem;">Consentimiento de Tratamiento de Datos</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">
                Antes de continuar, debes leer y aceptar la política de tratamiento de datos personales
            </p>
        </div>

        <div class="consent-box">
            {{ texto_politica }}
        </div>

        <form method="POST" action="{{ url_for('auth.consentimiento') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="checkbox-group">
                <input type="checkbox" id="acepto" required onchange="document.getElementById('btnAceptar').disabled = !this.checked">
                <label for="acepto">
                    He leído y acepto la Política de Tratamiento de Datos Personales conforme a la Ley 1581 de 2012.
                    Autorizo el uso de mis datos para los fines descritos.
                </label>
            </div>

            <input type="hidden" name="aceptado" value="si">

            <button type="submit" class="btn btn-primary btn-full btn-lg" id="btnAceptar" disabled>
                Aceptar y Continuar
            </button>
        </form>
    </div>
</div>
{% endblock %}
